<!DOCTYPE html>

</head>
<body class="editor-layout">

              <svg viewBox="0 0 20 21" width="20" height="20" fill="currentColor"><path d="M11.348 13.897l-.072-.072-.085.056a4.464 4.464 0 1 1 .09-7.343 4.464 4.464 0 0 1-.001 7.343l-.056.086.072.072 4.926 4.926 1.55-1.55-4.927-4.926Zm-3.366-1.25a3.665 3.665 0 1 0 0-7.33 3.665 3.665 0 0 0 0 7.33Z"/></svg>

        <li>
          <button class="rail__item" type="button" data-stub data-collapsed="true" title="Extension" aria-label="Extension">

    </div>

    <ul class="rail__list rail__list--footer" role="list">
      <li>
        <button class="rail__item" type="button" data-stub data-collapsed="true" title="Referrals" aria-label="Referrals">
          <span class="rail__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
          </span>
          <span class="rail__label">Referrals</span>
        </button>
      </li>
      <li>
        <button class="rail__item" type="button" data-stub data-collapsed="true" title="Support Center" aria-label="Support Center">
          <span class="rail__icon" aria-hidden="true">

          </span>
          <span class="rail__label">Support Center</span>
        </button>
      </li>
      <li>
        <button class="rail__item" type="button" data-stub data-collapsed="true" title="Account Settings" aria-label="Account Settings">
          <span class="rail__icon rail__icon--avatar" aria-hidden="true">M</span>
          <span class="rail__label">Account Settings</span>
        </button>
      </li>
    </ul>
  </nav>

  <!-- ==========================================================================
       Builder
       ========================================================================== -->
  <main class="builder">
    <header class="builder__bar">
      <div class="builder__bar-left">
        <a class="icon-btn" href="/dashboard.html" aria-label="Back to Resumes">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </a>
        <input class="builder__title" type="text" value="Untitled Resume" aria-label="Resume Title" maxlength="196" minlength="4" autocomplete="off" />
      </div>
      <div class="builder__bar-right">
        <button class="btn btn--secondary" type="button" data-stub>Export PDF</button>
        <button class="btn btn--secondary" type="button" data-stub>Menu</button>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Resume builder sections" id="builder-tabs">
      <button class="tab" type="button" role="tab" id="tab-content" aria-selected="true" aria-controls="panel-content" data-tab="content">
        <svg class="tab__icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path clip-rule="evenodd" d="M3.037.307l.039-.001h5.626c.18 0 .355.07.485.196l4.298 4.133c.137.132.215.314.215.505v9.86a.7.7 0 0 1-.7.7H3a.7.7 0 0 1-.7-.7V1.007a.7.7 0 0 1 .737-.7Zm.663 1.4v12.593h8.6V5.84H8.702a.7.7 0 0 1-.7-.7V1.706H3.7Zm5.702.944 1.86 1.789h-1.86V2.651Z" fill-rule="evenodd"/></svg>
        <span>Content Editor</span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-design" aria-selected="false" aria-controls="panel-design" data-tab="design" data-stub>
        <svg class="tab__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>
        <span>Designer</span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-analysis" aria-selected="false" aria-controls="panel-analysis" data-tab="analysis" data-stub>
        <svg class="tab__icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path clip-rule="evenodd" d="M9.9.131a7.95 7.95 0 0 1 4.97 4.499c.197.475.344.967.439 1.47H7.5V.131c.471 0 .94.044 1.4.132ZM15.868 6.1a7.79 7.79 0 0 0-1.768-3.903A7.79 7.79 0 0 0 9.9.132v5.968h5.968ZM7.5 1v7.5H16a7.995 7.995 0 0 1-8.5 7.5A8 8 0 0 1 7.5 1Zm1.6 13.438a6.5 6.5 0 0 0 4.337-3.915H7.5v-4.9H1.132A6.5 6.5 0 0 0 7.5 16c.533 0 1.067-.05 1.6-.162Z" fill-rule="evenodd"/></svg>
        <span>Analyzer</span>
        <span class="tab__badge" title="The number of issues found in your resume">11</span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-matching" aria-selected="false" aria-controls="panel-matching" data-tab="matching" data-stub>
        <svg class="tab__icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path clip-rule="evenodd" d="M14.732 5.588H4.422L7.5 2.51 6.51 1.52 2.408 5.622a.667.667 0 0 0 .566 1.366h11.758V5.588ZM2.285 10.421h10.31L9.477 13.539l.99.99 4.142-4.142a.667.667 0 0 0-.566-1.366H2.285v1.4Z" fill-rule="evenodd"/></svg>
        <span>Job Matcher</span>
        <span class="tab__badge" title="Attach a Job Description to this resume">!</span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-cover" aria-selected="false" aria-controls="panel-cover" data-tab="cover" data-stub>
        <svg class="tab__icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M4.805 6.693h6.39v1.4h-6.39v-1.4Zm6.39 2.521h-6.39v1.4h6.39v-1.4Zm-6.39 2.521h6.39v1.4h-6.39v-1.4Z"/><path clip-rule="evenodd" d="M3.037.307l.039-.001h5.626c.18 0 .355.07.485.196l4.298 4.133c.137.132.215.314.215.505v9.86a.7.7 0 0 1-.7.7H3a.7.7 0 0 1-.7-.7V1.007a.7.7 0 0 1 .737-.7Zm.663 1.4v12.593h8.6V5.84H8.702a.7.7 0 0 1-.7-.7V1.706H3.7Zm5.702.944 1.86 1.789h-1.86V2.651Z" fill-rule="evenodd"/></svg>
        <span>Cover Letter</span>
      </button>
    </div>

    <!-- Content Editor panel: resizable split (editor | preview) -->
    <section class="panel" id="panel-content" role="tabpanel" aria-labelledby="tab-content" tabindex="0">
      <div class="split" id="split" data-split="55">
        <div class="split__pane split__pane--left" id="editor-pane">
          <!-- Part 2 fills this with the section accordion. -->
          <div class="placeholder">
            <h2 class="placeholder__title">Content Editor</h2>
            <p class="text-muted">The section list (Contact Information, Work Experience, Projects, …) lands in the next part.</p>
          </div>
        </div>
        <div class="split__handle" id="split-handle" role="separator" aria-orientation="vertical" aria-label="Resize editor and preview" tabindex="0" aria-valuemin="30" aria-valuemax="70" aria-valuenow="55"></div>
        <div class="split__pane split__pane--right" id="preview-pane">
          <div class="preview">
            <iframe id="preview-iframe" class="preview__frame" title="Resume preview"></iframe>
          </div>
        </div>
      </div>
    </section>

    <!-- Stub panels (Part 4): filled by editor.js with a "coming soon" state. -->
    <section class="panel panel--stub" id="panel-design" role="tabpanel" aria-labelledby="tab-design" hidden></section>
    <section class="panel panel--stub" id="panel-analysis" role="tabpanel" aria-labelledby="tab-analysis" hidden></section>
    <section class="panel panel--stub" id="panel-matching" role="tabpanel" aria-labelledby="tab-matching" hidden></section>
    <section class="panel panel--stub" id="panel-cover" role="tabpanel" aria-labelledby="tab-cover" hidden></section>
  </main>

  <script type="module" src="/js/editor.js"></script>
</body>
</html>
